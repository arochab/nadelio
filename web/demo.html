<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore Nadelio with clearly labelled fictional examples. No account, live audit or API call required.">
<title>Nadelio | Interactive sample</title>
<style>
@font-face{font-family:Archivo;src:url('assets/v2/fonts/archivo-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Archivo;src:url('assets/v2/fonts/archivo-600.woff2') format('woff2');font-weight:600 900;font-display:swap}
:root{font-family:Archivo,Arial,sans-serif;color:#E8DFD2;background:#211A14;line-height:1.55;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}header,main,footer{width:min(1100px,calc(100% - 40px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:25px 0;border-bottom:1px solid #564D3C}a{color:#D7B572;text-underline-offset:4px}a:hover{color:#fff}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #D7B572;outline-offset:5px}.brand{font-size:24px;font-weight:800;letter-spacing:-1px}nav{display:flex;gap:16px;align-items:center}#lang{padding:6px 12px;background:transparent;color:inherit;border:1px solid #958772;border-radius:4px}.intro{max-width:800px;padding:44px 0 28px}h1{font-size:clamp(32px,5vw,56px);line-height:1.07;letter-spacing:-1.8px;font-weight:750;margin:0 0 24px}h2{font-size:25px;line-height:1.25;margin-top:0}p{max-width:70ch}.intro p{font-size:18px;color:#C9BDAA}.notice{padding:14px 18px;border-left:4px solid #C6A15B;background:#30261C;font-size:15px;color:#E8DFD2;margin:0 0 36px}.workspace{display:grid;grid-template-columns:270px 1fr;gap:50px;align-items:start}label{display:block;margin-bottom:12px;font-weight:700}select{width:100%;color:#E8DFD2;background:#30261C;border:1px solid #958772;border-radius:5px;padding:13px 9px}aside p{color:#C9BDAA;font-size:15px}#result{padding:26px;background:#2A221B;border-radius:8px;border:1px solid #564D3C}.result-top{font-size:13px;color:#C9BDAA}#verdict{margin:10px 0;font-size:clamp(25px,3vw,38px);letter-spacing:-.7px}#explanation{margin:0 0 24px}.chart-row{margin:28px 0}.chart-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:16px}.track{height:30px;background:#362E24;position:relative;border-radius:5px;overflow:hidden}.interval{position:absolute;top:7px;height:16px;background:#C6A15B;border-radius:2px}.point{position:absolute;top:1px;height:28px;width:3px;background:#fff}.axis{display:flex;justify-content:space-between;color:#C9BDAA;font-size:13px;margin-top:12px}.small{font-size:14px;color:#C9BDAA}.result-note{padding-top:18px;border-top:1px solid #564D3C;margin-bottom:0}.journey{margin:55px 0 30px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:25px}.steps p{font-size:15px;color:#C9BDAA}.steps h3{font-size:17px;margin-bottom:8px}details{border-top:1px solid #564D3C;margin:35px 0;padding-top:20px}summary{cursor:pointer;font-weight:700}.detail{padding-top:15px;color:#C9BDAA}footer{padding:26px 0 35px;border-top:1px solid #564D3C;color:#C9BDAA;font-size:14px}footer a{margin-right:18px}.empty{padding:26px 0;color:#C9BDAA}
@media(max-width:760px){header,main,footer{width:calc(100% - 32px)}.workspace{grid-template-columns:1fr;gap:22px}.intro{padding-top:30px}.steps{grid-template-columns:1fr 1fr;gap:18px}#result{padding:20px}.notice{margin-bottom:24px}}@media(max-width:420px){.steps{grid-template-columns:1fr}nav{gap:10px}.brand{font-size:21px}}
</style>
<header><a class="brand" href="https://www.nadelio.com" aria-label="Nadelio public site">NADELIO</a><nav><a id="source-link" href="https://github.com/arochab/nadelio">Source code</a><button id="lang" type="button">Français</button></nav></header>
<main>
  <section class="intro"><h1 id="title"></h1><p id="intro"></p></section>
  <p class="notice" id="notice"></p>
  <section class="workspace" aria-label="Interactive demonstration">
    <aside><label for="scenario" id="choose"></label><select id="scenario"><option value="clear"></option><option value="overlap"></option><option value="missing"></option></select><p id="scenario-help"></p></aside>
    <div id="result" aria-live="polite"><div class="result-top" id="result-top"></div><h2 id="verdict"></h2><p id="explanation"></p><div id="chart"></div><p class="small result-note" id="result-note"></p></div>
  </section>
  <section class="journey"><h2 id="pipeline-title"></h2><div class="steps" id="steps"></div></section>
  <details><summary id="details-title"></summary><div class="detail" id="details-content"></div></details>
</main>
<footer><span id="author"></span><p><a id="live-link" href="https://www.nadelio.com"></a><a id="repo-link" href="https://github.com/arochab/nadelio"></a></p></footer>
<script>
'use strict';
const copy={
 en:{title:'A clearer answer, with its limits.',intro:'Nadelio compares how brands appear in Google results and in answers from an AI assistant. This interactive sample explains how to read the result.',notice:'Fictional demonstration. Brand names, scores and intervals below are invented for illustration. No search, AI call, payment or real audit runs on this page.',choose:'Choose an example',options:['A clear difference','Results too close to call','Not enough data'],help:'Switch examples to see how the conclusion changes. An inconclusive result is useful information too.',top:'Illustrative AI visibility score · scale from 0 to 100',clear:['The difference is clear in this example.','The two intervals do not overlap. The sample illustrates how Nadelio distinguishes a visible difference from variation between repeated answers.'],overlap:['We cannot confidently choose a leader.','The intervals overlap. A slightly higher score is not enough to claim that one brand performs better.'],missing:['More observations are needed.','One observation cannot establish variation across repeated answers. This example deliberately shows no confidence interval and no comparative verdict.'],note:'Each bar is an invented interval; the white mark is its central score. These are teaching examples, not measured brand performance or a prediction of sales.',missingNote:'No interval has been generated from insufficient data. A real audit must preserve this uncertainty.',noChart:'Insufficient observations: comparison unavailable.',pipeline:'How the full product works',steps:[['Identify the business','Confirm the brand, market and relevant customer questions.'],['Gather observations','Search Google and ask the selected AI assistant. Repeat the AI observations.'],['Compare transparently','Show source links, the measured assistant and the range of observed uncertainty.'],['Support a decision','Read the evidence and its limits before deciding what to investigate or improve.']],details:'What is real, and what is simulated?',detail:'<p>The source repository contains the Python application, search and AI integrations, report generation and the production interface. This page is a separate, self-contained presentation of its uncertainty states.</p><p>The figures on this page are fixed fictional fixtures. Switching scenarios changes their presentation; it does not run the Python measurement pipeline or call an AI model. The public product is available separately and its live features depend on its service configuration.</p>',author:'Designed and developed by Adam Chabbi.',live:'Open the public product',repo:'Explore the source code'},
 fr:{title:'Une conclusion claire, avec ses limites.',intro:'Nadelio compare la présence des marques dans les résultats Google et dans les réponses d’un assistant IA. Cette démonstration interactive explique comment lire le résultat.',notice:'Démonstration fictive. Les marques, scores et intervalles ci-dessous sont inventés pour expliquer le produit. Cette page ne lance aucune recherche, aucun appel IA, aucun paiement et aucun audit réel.',choose:'Choisir un exemple',options:['Un écart net','Des résultats trop proches','Pas assez de données'],help:'Changez d’exemple pour voir comment la conclusion évolue. Un résultat indécis est aussi une information utile.',top:'Score de visibilité IA illustratif · échelle de 0 à 100',clear:['L’écart est net dans cet exemple.','Les deux intervalles ne se chevauchent pas. L’exemple montre comment Nadelio distingue un écart visible d’une variation entre plusieurs réponses.'],overlap:['Impossible de désigner un leader avec confiance.','Les intervalles se chevauchent. Un score légèrement supérieur ne suffit pas à affirmer qu’une marque est mieux placée.'],missing:['Il faut davantage d’observations.','Une seule observation ne permet pas d’établir la variation entre plusieurs réponses. Cet exemple n’affiche donc ni intervalle de confiance, ni verdict comparatif.'],note:'Chaque barre représente un intervalle inventé ; le repère blanc indique son score central. Ces exemples pédagogiques ne mesurent aucune marque réelle et ne prédisent pas ses ventes.',missingNote:'Aucun intervalle n’a été fabriqué à partir de données insuffisantes. Un audit réel doit conserver cette incertitude.',noChart:'Observations insuffisantes : comparaison indisponible.',pipeline:'Comment fonctionne le produit complet',steps:[['Identifier l’entreprise','Confirmer la marque, le marché et les questions pertinentes de ses clients.'],['Recueillir des observations','Interroger Google et l’assistant IA choisi. Répéter les observations de l’IA.'],['Comparer avec transparence','Présenter les sources, l’assistant utilisé et l’intervalle d’incertitude.'],['Aider à décider','Examiner les résultats et leurs limites avant de choisir les points à améliorer.']],details:'Qu’est-ce qui est réel ou simulé ?',detail:'<p>Le dépôt source contient l’application Python, les intégrations de recherche et d’IA, la génération de rapports et l’interface de production. Cette page est une présentation autonome de ses différents états d’incertitude.</p><p>Les chiffres affichés sont des exemples fictifs prédéfinis. Changer de scénario modifie leur présentation : cela n’exécute pas le moteur de mesure Python et n’interroge pas une IA. Le produit public est accessible séparément ; ses fonctions en direct dépendent de la configuration de ses services.</p>',author:'Conçu et développé par Adam Chabbi.',live:'Ouvrir le produit public',repo:'Consulter le code source'}
};
let language = new URLSearchParams(location.search).get('lang')==='fr'?'fr':'en';
const fixtures={clear:[{name:'Orbe Studio',point:78,low:74,high:82},{name:'Rivage Cloud',point:52,low:46,high:58}],overlap:[{name:'Orbe Studio',point:62,low:55,high:69},{name:'Rivage Cloud',point:60,low:53,high:67}]};
const el=id=>document.getElementById(id);
function render(){const t=copy[language],key=el('scenario').value;document.documentElement.lang=language;el('lang').textContent=language==='en'?'Français':'English';for(const [id,k] of Object.entries({title:'title',intro:'intro',notice:'notice',choose:'choose','scenario-help':'help','result-top':'top','pipeline-title':'pipeline','details-title':'details',author:'author','live-link':'live','repo-link':'repo'}))el(id).textContent=t[k];el('source-link').textContent=language==='en'?'Source code':'Code source';[...el('scenario').options].forEach((o,i)=>o.textContent=t.options[i]);el('verdict').textContent=t[key][0];el('explanation').textContent=t[key][1];el('result-note').textContent=key==='missing'?t.missingNote:t.note;el('chart').replaceChildren();if(key==='missing'){const p=document.createElement('p');p.className='empty';p.textContent=t.noChart;el('chart').append(p);}else{fixtures[key].forEach(row=>{const box=document.createElement('div');box.className='chart-row';box.setAttribute('role','img');box.setAttribute('aria-label',`${row.name}: ${row.point}, interval ${row.low} to ${row.high}`);box.innerHTML=`<div class="chart-label"><strong>${row.name}</strong><span>${row.point} (${row.low} - ${row.high})</span></div><div class="track"><div class="interval" style="left:${row.low}%;width:${row.high-row.low}%"></div><div class="point" style="left:${row.point}%"></div></div>`;el('chart').append(box)});const axis=document.createElement('div');axis.className='axis';axis.innerHTML='<span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>';el('chart').append(axis)}el('steps').innerHTML=t.steps.map(s=>`<div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');el('details-content').innerHTML=t.detail;}
el('scenario').addEventListener('change',render);el('lang').addEventListener('click',()=>{language=language==='en'?'fr':'en';render()});render();
</script>
</html>
